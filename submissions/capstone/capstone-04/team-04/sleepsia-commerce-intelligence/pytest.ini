[pytest]
# M-7 Phase 5: Pytest Configuration for CI/CD Integration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git .venv __pycache__ *.egg

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires infrastructure)
    slow: Slow running tests
    edge_case: Edge case tests
    performance: Performance tests

# Reporting
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --cov=backend
    --cov=api
    --cov-report=html
    --cov-report=term-missing

# Coverage settings
[coverage:run]
source = backend,api
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

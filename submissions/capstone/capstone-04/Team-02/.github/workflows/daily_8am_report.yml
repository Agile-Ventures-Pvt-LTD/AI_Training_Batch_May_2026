name: Sleepsia 8:00 AM Daily Executive Report Cloud Cron

on:
  schedule:
    # 2:30 AM UTC = 8:00 AM IST every single day
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub UI

jobs:
  dispatch-executive-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Dynamic Email Dispatcher
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python send_daily_report_email.py
